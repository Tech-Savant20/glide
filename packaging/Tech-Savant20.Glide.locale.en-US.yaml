ShortDescription: Mac-style smooth scrolling for Windows mouse wheels.
Description: |-
  Glide turns each notch of a mouse wheel into smooth motion, like scrolling on a Mac:
  eased, steady while you roll, and coasting after a flick. It leaves admin windows,
  games and apps with their own smooth scrolling alone, and steps aside completely
  while exam software or games with anti-cheat run.
